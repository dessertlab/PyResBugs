[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyresbugs"
version = "0.1.0"
description = "Command-line tools for managing and checking out the PyResBugs dataset"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "The PyResBugs maintainers" },
]
dependencies = [
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
pyresbugs = "pyresbugs.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
